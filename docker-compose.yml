version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: k8scache-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ""  # без пароля для простоты
    restart: unless-stopped

  app:
    build: .
    container_name: k8scache-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_CACHE_TYPE: "none"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
